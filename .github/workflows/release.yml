name: Release PR

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-pr-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.22.0'

jobs:
  verify-artifacts:
    name: Verify CI release artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download release consumer artifacts from CI run
        uses: actions/download-artifact@v7
        with:
          name: release-consumer-artifacts-${{ github.event.workflow_run.head_sha }}
          path: .release-artifacts-consumer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify downloaded release handoff plan
        run: >-
          node scripts/prepare-release-handoff.mjs
          --directory=.release-artifacts-consumer
          --revision="${{ github.event.workflow_run.head_sha }}"
          --verify-plan=.release-artifacts-consumer/release-handoff.json

      - name: Download workspace build artifacts from CI run
        uses: actions/download-artifact@v7
        with:
          name: workspace-build-${{ github.event.workflow_run.head_sha }}
          path: .versioned-docs-consumer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify downloaded versioned Docs artifact
        run: >-
          node apps/docs/scripts/verify-versioned-docs-artifact.mjs
          --dist=.versioned-docs-consumer/apps/docs/dist
          --revision="${{ github.event.workflow_run.head_sha }}"

      - name: Download Windows desktop artifact from the same CI run
        uses: actions/download-artifact@v7
        with:
          name: desktop-windows-${{ github.event.workflow_run.head_sha }}
          path: .desktop-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify Windows desktop artifact coherence
        run: >-
          node apps/docs/scripts/verify-desktop-artifact.mjs
          --directory=.desktop-artifact
          --revision="${{ github.event.workflow_run.head_sha }}"

  version:
    name: Create or update Changesets release PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    needs: verify-artifacts
    outputs:
      pr-number: ${{ steps.changesets.outputs.pr-number }}
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release pull request
        id: changesets
        uses: changesets/action/version@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: pnpm release:version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          pr-base-branch: master
          push-with-git-cli: true

  dispatch-release-pr-ci:
    name: Dispatch release PR CI
    if: needs.version.result == 'success' && needs.version.outputs.pr-number != ''
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Dispatch CI for the exact release pull request revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.version.outputs.pr-number }}
        run: |
          printf '%s' "$PR_NUMBER" | grep -Eq '^[1-9][0-9]*$'
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_ref="$(printf '%s' "$pr_json" | jq -er '.head.ref')"
          head_sha="$(printf '%s' "$pr_json" | jq -er '.head.sha')"
          head_repository="$(printf '%s' "$pr_json" | jq -er '.head.repo.full_name')"
          base_ref="$(printf '%s' "$pr_json" | jq -er '.base.ref')"
          test "$head_repository" = "$GITHUB_REPOSITORY"
          test "$base_ref" = 'master'
          git check-ref-format --branch "$head_ref"
          printf '%s' "$head_sha" | grep -Eq '^[a-f0-9]{40}$'
          dispatch_json="$(
            jq -n --arg ref "$head_ref" --arg sha "$head_sha" \
              '{ ref: $ref, inputs: { "expected-sha": $sha }, return_run_details: true }' |
              gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
                --input -
          )"
          run_id="$(printf '%s' "$dispatch_json" | jq -er '.workflow_run_id')"
          run_url="$(printf '%s' "$dispatch_json" | jq -er '.html_url')"
          printf '%s' "$run_id" | grep -Eq '^[1-9][0-9]*$'
          gh run watch "$run_id" --exit-status --interval 10
          run_json="$(gh run view "$run_id" --json event,headSha,conclusion,url)"
          test "$(printf '%s' "$run_json" | jq -er '.event')" = 'workflow_dispatch'
          test "$(printf '%s' "$run_json" | jq -er '.headSha')" = "$head_sha"
          test "$(printf '%s' "$run_json" | jq -er '.conclusion')" = 'success'
          test "$(printf '%s' "$run_json" | jq -er '.url')" = "$run_url"
          printf 'Verified CI run [%s](%s) for PR #%s at `%s` (`%s`).\n' \
            "$run_id" "$run_url" "$PR_NUMBER" "$head_ref" "$head_sha" >> "$GITHUB_STEP_SUMMARY"
