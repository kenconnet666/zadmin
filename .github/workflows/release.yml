name: Release PR

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-pr-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.22.0'

jobs:
  verify-artifacts:
    name: Verify CI release artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download release consumer artifacts from CI run
        uses: actions/download-artifact@v7
        with:
          name: release-consumer-artifacts-${{ github.event.workflow_run.head_sha }}
          path: .release-artifacts-consumer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify downloaded release handoff plan
        run: >-
          node scripts/prepare-release-handoff.mjs
          --directory=.release-artifacts-consumer
          --revision="${{ github.event.workflow_run.head_sha }}"
          --verify-plan=.release-artifacts-consumer/release-handoff.json

      - name: Download workspace build artifacts from CI run
        uses: actions/download-artifact@v7
        with:
          name: workspace-build-${{ github.event.workflow_run.head_sha }}
          path: .versioned-docs-consumer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify downloaded versioned Docs artifact
        run: >-
          node apps/docs/scripts/verify-versioned-docs-artifact.mjs
          --dist=.versioned-docs-consumer/apps/docs/dist
          --revision="${{ github.event.workflow_run.head_sha }}"

      - name: Download Windows desktop artifact from the same CI run
        uses: actions/download-artifact@v7
        with:
          name: desktop-windows-${{ github.event.workflow_run.head_sha }}
          path: .desktop-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify Windows desktop artifact coherence
        run: >-
          node apps/docs/scripts/verify-desktop-artifact.mjs
          --directory=.desktop-artifact
          --revision="${{ github.event.workflow_run.head_sha }}"

  version:
    name: Create or update Changesets release PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    needs: verify-artifacts
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release pull request
        uses: changesets/action/version@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: pnpm release:version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          pr-base-branch: master
