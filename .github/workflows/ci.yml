name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_OPTIONS: --max-old-space-size=4096
  NODE_VERSION: '24'
  PNPM_VERSION: '11.22.0'

jobs:
  workspace:
    name: Workspace, browsers, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ignore Linux-only file mode changes
        run: git config core.fileMode false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @zadmin/docs exec playwright install --with-deps chromium firefox webkit

      - name: Check types and Svelte contracts
        run: pnpm check

      - name: Lint and format check
        run: pnpm lint

      - name: Run full workspace tests
        run: pnpm test

      - name: Run Docs end-to-end tests
        run: pnpm --filter @zadmin/docs test:e2e

      - name: Build all packages, apps, plugins, and WeChat output
        run: pnpm build

      - name: Verify generated tracked files are unchanged
        run: git diff --exit-code

      - name: Upload workspace build outputs
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: workspace-build-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/*/build
            apps/*/dist
            packages/*/dist
            plugins/*/dist
            ui/*/dist

  acceptance:
    name: Coverage, packages, and Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ignore Linux-only file mode changes
        run: git config core.fileMode false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for coverage suites
        run: pnpm --filter @zadmin/docs exec playwright install --with-deps chromium

      - name: Run ZUI coverage
        run: pnpm --filter @zadmin/zui test:coverage

      - name: Run Svelte Taro coverage
        run: pnpm --filter @zadmin/svelte-taro test:coverage

      - name: Run ZUI Taro coverage
        run: pnpm --filter @zadmin/zui-taro test:coverage

      - name: Run Tauri facade coverage
        run: pnpm --filter @zadmin/tauri test:coverage

      - name: Run Svelte Taro external package acceptance
        run: pnpm --filter @zadmin/svelte-taro test:package

      - name: Run Tauri external package acceptance
        run: pnpm --filter @zadmin/tauri test:package

      - name: Build Storybook
        run: pnpm --filter @zadmin/docs build-storybook

      - name: Verify reports and generated tracked files are unchanged
        run: >-
          git diff --exit-code -- .
          ':(exclude)apps/docs/content/wechat-package-acceptance.json'
          ':(exclude)apps/docs/content/wechat-package-acceptance.md'

  desktop-windows:
    name: Windows desktop and Rust
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      RUST_BACKTRACE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust components and target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Check desktop TypeScript and Svelte
        run: pnpm check:desktop

      - name: Test desktop frontend
        run: pnpm test:desktop

      - name: Build desktop frontend for Tauri macros
        run: pnpm --filter @zadmin/desktop build

      - name: Check Rust formatting
        run: pnpm --filter @zadmin/desktop rust:fmt

      - name: Check Rust targets
        run: pnpm --filter @zadmin/desktop rust:check

      - name: Run Clippy with warnings denied
        run: pnpm --filter @zadmin/desktop rust:clippy

      - name: Test Rust commands
        run: pnpm --filter @zadmin/desktop rust:test

      - name: Verify generated TypeScript bindings
        run: pnpm --filter @zadmin/desktop bindings:check

      - name: Build debug desktop executable for pull requests
        if: github.event_name == 'pull_request'
        run: pnpm --filter @zadmin/desktop tauri:build:debug

      - name: Build release desktop bundles
        if: github.event_name != 'pull_request'
        run: pnpm build:desktop

      - name: Verify generated tracked files are unchanged
        run: git diff --exit-code

      - name: Upload Windows desktop bundles
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
