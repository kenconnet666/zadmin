name: Setup pnpm workspace
description: Install the pinned Node.js and pnpm toolchain with frozen workspace dependencies.

inputs:
  node-version:
    description: Node.js version used by the job.
    required: false
    default: '24'
  pnpm-version:
    description: pnpm version used by the job.
    required: false
    default: '11.22.0'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
