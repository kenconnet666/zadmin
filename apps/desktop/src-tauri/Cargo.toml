[package]
name = "zadmin-desktop"
version = "0.1.0"
description = "ZAdmin Windows desktop capability host"
authors = ["ZAdmin contributors"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
name = "zadmin_desktop_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "=0.0.12"
tauri = { version = "=2.11.5", default-features = false, features = ["specta"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-clipboard-manager = { version = "=2.3.2", optional = true }
tauri-plugin-dialog = { version = "=2.7.2", optional = true }
tauri-plugin-fs = { version = "=2.5.1", features = ["watch"], optional = true }
tauri-plugin-log = { version = "=2.9.0", optional = true }
tauri-plugin-notification = { version = "=2.3.3", optional = true }
tauri-plugin-opener = { version = "=2.5.4", optional = true }
tauri-plugin-os = { version = "=2.3.2", optional = true }
tauri-plugin-process = { version = "=2.3.1", optional = true }
tauri-plugin-store = { version = "=2.4.4", optional = true }
tauri-plugin-window-state = { version = "=2.4.1", optional = true }
thiserror = "2"

[features]
default = ["custom-protocol", "desktop-runtime"]
bindings = ["tauri/test", "desktop-permissions"]
custom-protocol = ["tauri/custom-protocol"]
desktop-permissions = [
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-fs",
    "dep:tauri-plugin-log",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-os",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-store",
    "dep:tauri-plugin-window-state",
]
desktop-runtime = ["tauri/wry", "desktop-permissions"]
