  - apps/*
  - packages/*
  - plugins/*

catalog:
  '@aws-sdk/client-s3': ^3.1115.0
  '@aws-sdk/s3-request-presigner': ^3.1115.0
  '@chromatic-com/storybook': ^5.3.0
  '@eslint/js': ^10.0.1
  '@fontsource/fira-mono': ^5.2.7
  '@neoconfetti/svelte': ^2.2.2
  '@playwright/test': ^1.62.1
  '@standard-schema/spec': ^1.1.0
  '@storybook/addon-a11y': ^10.5.10
  '@storybook/addon-docs': ^10.5.10
  '@storybook/addon-svelte-csf': ^5.1.2
  '@storybook/addon-vitest': ^10.5.10
  '@storybook/sveltekit': ^10.5.10
  '@sveltejs/adapter-node': ^5.5.7
  '@sveltejs/kit': ^2.70.3
  '@sveltejs/package': ^2.5.8
  '@sveltejs/vite-plugin-svelte': ^7.3.0
  '@types/node': ^26.2.0
  '@types/estree': ^1.0.9
  '@types/stylis': ^4.2.7
  '@vitest/browser-playwright': ^4.1.11
  '@vitest/coverage-v8': ^4.1.11
  csstype: ^3.2.3
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  eslint: ^10.9.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-svelte: ^3.23.0
  estree-walker: ^3.0.3
  globals: ^17.11.0
  magic-string: ^1.2.2
  playwright: ^1.62.1
  postgres: ^3.4.9
  prettier: ^3.9.6
  prettier-plugin-svelte: ^4.1.1
  redis: ^6.2.1
  semver: ^7.8.5
  react: ^19.2.8
  react-dom: ^19.2.8
  storybook: ^10.5.10
  stylis: ^4.4.0
  tar: ^7.5.22
  svelte: ^5.56.10
  svelte-check: ^4.7.6
  typescript: ^6.0.3
  typescript-eslint: ^8.67.0
  tsx: ^4.23.12
  vite: ^8.2.2
  vitest: ^4.1.11
  vitest-browser-svelte: ^3.0.0

catalogs:
  wechat:
    '@tarojs/cli': 4.2.1
    '@tarojs/components': 4.2.1
    '@tarojs/helper': 4.2.1
    '@tarojs/plugin-framework-solid': 4.2.1
    '@tarojs/plugin-platform-weapp': 4.2.1
    '@tarojs/runtime': 4.2.1
    '@tarojs/service': 4.2.1
    '@tarojs/shared': 4.2.1
    '@tarojs/taro': 4.2.1
    '@tarojs/vite-runner': 4.2.1
    babel-plugin-transform-solid-jsx: 4.2.1
    miniprogram-api-typings: 5.2.3
    solid-js: 1.9.15
    vite: 4.5.14
    vite-plugin-solid: 2.11.14

catalogMode: strict
disallowWorkspaceCycles: true
linkWorkspacePackages: false
sharedWorkspaceLockfile: true

# Taro 4.2.1 pins vulnerable transitive releases. These target-only overrides
# stay until upstream moves to patched versions; real WeChat builds cover them.
overrides:
  '@tarojs/components>swiper': 12.1.2
  '@tarojs/helper>esbuild': 0.25.12

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': false
  core-js: false
  esbuild: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1115.0'
  - '@aws-sdk/s3-request-presigner@3.1115.0'
  - eslint@10.9.0
  - svelte@5.56.10
